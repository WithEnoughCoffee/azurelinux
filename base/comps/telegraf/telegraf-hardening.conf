# Azure Linux systemd sandboxing for the telegraf metrics agent.
#
# Telegraf runs unprivileged (User=telegraf) and only reads host metrics, so we restrict
# its access to the system. Adapted from openSUSE's hardening
# (https://en.opensuse.org/openSUSE:Security_Features#Systemd_hardening_effort).
#
# NOTE: PrivateDevices is intentionally OMITTED. The curated build compiles in hardware
# inputs (smart, smartctl, ipmi_sensor, infiniband) that need /dev access; PrivateDevices
# would hide those device nodes and break them.
[Service]
ProtectSystem=full
ProtectHome=true
ProtectHostname=true
ProtectClock=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictRealtime=true
# Several plugin SDKs (e.g. the Azure SDK credential cache) write under $HOME.
Environment=HOME=/var/lib/telegraf
