[components.rust-proptest]
# Pin past the distro default snapshot (proptest 1.9.0) to Fedora f43 HEAD,
# providing 1.11.0. rust-ctutils 0.4.2 (pulled in transitively by the
# bumped digest/hmac cascade for uv 0.10.12) requires
# crate(proptest/default) >= 1.11.0, < 2.0.0, which 1.9.0 does not satisfy.
# No other in-tree consumer requires the older range, so no compat package
# is needed.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "73ccd819a175dc490f9c60e9930bd0676ba29811" }
