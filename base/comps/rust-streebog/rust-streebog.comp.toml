[components.rust-streebog]
# Pin past the distro default snapshot to Fedora f43 HEAD, providing
# streebog 0.11.0, required by hmac 0.13.0's dev/test matrix in uv
# 0.10.12's crate-alignment cascade (crate(streebog/default) >= 0.11.0).
# The new rust-streebog0.10 compat package (pinned at the commit this
# default previously resolved to) preserves the older range; this is
# distinct from the pre-existing rust-streebog0.9 compat package, which
# serves an even older streebog 0.9 range.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "a8a5fd3b695654bbb28e147c54d0f82298edf1f1" }
